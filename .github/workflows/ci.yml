name: Windows CI

on:
  push:
    branches: [main]
    paths-ignore: &documentation-only
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *documentation-only
  workflow_dispatch:
    inputs:
      install_acceptance:
        description: 'Only run isolated real installer acceptance; never publish'
        type: boolean
        default: false
      failure_acceptance:
        description: 'With install_acceptance: interrupt actual installer and new startup in disposable runners'
        type: boolean
        default: false
      protocol5_acceptance:
        description: 'With install_acceptance: real published 104 to this checkout protocol-5 full package (failure_acceptance selects fault matrix)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  # Date-boundary fixtures model the application's China-based deployment.
  TZ: Asia/Shanghai
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.install_acceptance && 'install' || 'source' }}-${{ inputs.protocol5_acceptance || false }}-${{ inputs.failure_acceptance || false }}
  cancel-in-progress: true

jobs:
  ci-source-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # This gate depends on the event range, not only the final source tree.
      - name: Check main event failure policy range
        run: node desktop/scripts/wechat-failure-policy-review.cjs
        env:
          XIAOXI_FAILURE_POLICY_BASE: ${{ github.event.before }}
      - name: Verify unchanged merge tree and required CI
        id: proof
        run: node desktop/scripts/ci-source-proof.cjs --reuse
        env:
          GH_TOKEN: ${{ github.token }}

  real-installer-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_acceptance && !inputs.protocol5_acceptance }}
    # GitHub requires write access to read unpublished draft release assets.
    # This opt-in job only downloads artifacts; it has no publishing step.
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.failure_acceptance && '["installer-interruption","startup-interruption"]' || '["success"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch immutable original artifacts from unpublished acceptance draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path C:/Inputs -Force | Out-Null
          gh release download acceptance-original-64-20261012 --pattern original-1.1.64.exe --pattern handoff-update-assistant.exe --dir C:/Inputs
          if ($LASTEXITCODE -ne 0) { throw 'Original acceptance artifacts unavailable' }
          Move-Item -LiteralPath C:/Inputs/handoff-update-assistant.exe -Destination C:/Inputs/official-update-assistant.exe
          $assistant = Get-FileHash C:/Inputs/official-update-assistant.exe -Algorithm SHA256
          if ($assistant.Hash.ToLowerInvariant() -ne '3e4063c9857bc34e1c7dc33022417f8b3f8f44bd45fca9d6d5cb745be198a251') { throw 'Acceptance assistant changed' }
      - name: Fetch published target through pinned official CA
        shell: pwsh
        run: |
          curl.exe --fail --cacert desktop/src/main/cloud-test-ca.crt --retry 2 --max-time 600 https://115.159.88.100/artifacts/c7b3c4b51e09276dbe1602a71e2fb35b225c4e2c991022b96671927db308a8ff.exe -o C:/Inputs/latest-1.1.86.exe
          if ($LASTEXITCODE -ne 0) { throw 'Official installer unavailable' }
      - name: Original 64 real NSIS to current real NSIS and startup acknowledgement
        shell: pwsh
        run: ./desktop/scripts/update-install-acceptance.ps1 -Scenario '${{ matrix.scenario }}'
      - name: Preserve isolated installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-installer-acceptance-${{ matrix.scenario }}
          path: C:/Evidence/sandbox-real-upgrade
          if-no-files-found: warn
          retention-days: 7

  protocol5-install-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol5_acceptance }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.failure_acceptance && '["installer-interruption","startup-interruption"]' || '["success"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require explicit installer acceptance
        shell: pwsh
        run: if ('${{ inputs.install_acceptance }}' -ne 'true') { throw 'protocol5_acceptance requires install_acceptance' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Published 104 preload to current protocol-5 full NSIS
        shell: pwsh
        run: node desktop/scripts/protocol5-install-acceptance.cjs '${{ matrix.scenario }}'
      - name: Preserve protocol-5 real installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol5-install-acceptance-${{ matrix.scenario }}
          path: ${{ runner.temp }}/protocol5-install-acceptance
          if-no-files-found: warn
          retention-days: 7

  source-checks:
    needs: [ci-source-proof]
    name: source-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, moments-visual, reply-visual, rpa, runtime]
    if: ${{ always() && !inputs.install_acceptance && !inputs.protocol5_acceptance && needs.ci-source-proof.result != 'failure' && needs.ci-source-proof.result != 'cancelled' && needs.ci-source-proof.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The failure-policy gate compares the full event range, not only the
          # last commit in a multi-commit push or a synthetic PR merge.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked JavaScript dependencies
        run: npm ci --fetch-timeout=20000 --fetch-retries=1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Align Windows and Node clocks for local-time fixtures
        run: tzutil /s "China Standard Time"
      - name: Source self-checks (isolated; no live WeChat operations)
        run: |
          # A newly pushed branch has no previous SHA. Compare all its commits
          # with the default branch, rather than treating the whole repo as new.
          if ($env:XIAOXI_FAILURE_POLICY_BASE -match '^0{40}$') {
            $base = git merge-base HEAD "origin/$env:XIAOXI_DEFAULT_BRANCH"
            if ($LASTEXITCODE -ne 0 -or $base -notmatch '^[a-f0-9]{40}$') {
              throw 'Cannot resolve the new branch comparison base'
            }
            $env:XIAOXI_FAILURE_POLICY_BASE = $base
          }
          node scripts/run-self-checks.cjs --group "${{ matrix.group }}"
        env:
          XIAOXI_FAILURE_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          XIAOXI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Runtime and secret boundaries
        if: matrix.group == 'core'
        run: npm run check:clean-runtime
      - name: Build test renderer
        if: matrix.group == 'core'
        run: npm run build:test
      - name: Build delivery renderer
        if: matrix.group == 'core'
        run: npm run build:delivery
      - name: Record actual PR merge checkout
        if: matrix.group == 'core' && github.event_name == 'pull_request'
        run: node scripts/ci-source-proof.cjs --write
      - name: Preserve source verification identity
        if: matrix.group == 'core' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-ci-proof-${{ github.run_attempt }}
          path: desktop/.build/ci-source-proof.json
          if-no-files-found: error
          retention-days: 7

  source-and-renderer:
    if: ${{ always() && !inputs.install_acceptance && !inputs.protocol5_acceptance }}
    needs: [ci-source-proof, source-checks]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Require all five source groups
        shell: pwsh
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          PROOF_RESULT: ${{ needs.ci-source-proof.result }}
          REUSED: ${{ needs.ci-source-proof.outputs.reuse }}
        run: |
          if ($env:REUSED -eq 'true') {
            if ($env:PROOF_RESULT -ne 'success' -or $env:SOURCE_RESULT -ne 'skipped') { throw 'Invalid source reuse chain' }
          } elseif ($env:SOURCE_RESULT -ne 'success') {
            throw 'A required source group failed, was skipped or cancelled'
          }

  service-and-content:
    needs: [ci-source-proof]
    if: ${{ always() && !inputs.install_acceptance && !inputs.protocol5_acceptance && needs.ci-source-proof.result != 'failure' && needs.ci-source-proof.result != 'cancelled' && needs.ci-source-proof.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-ci.txt
      - name: Maintenance HTTP and feedback contracts
        working-directory: server/maintenance
        run: python -m unittest discover -s . -p 'test_*.py'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked service dependencies in parallel
        run: |
          $jobs = @(
            Start-Job -ArgumentList $env:GITHUB_WORKSPACE -ScriptBlock {
              param($root)
              Set-Location -LiteralPath $root
              python -m pip install -r desktop/requirements-ci.txt
              if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
            }
            Start-Job -ArgumentList $env:GITHUB_WORKSPACE -ScriptBlock {
              param($root)
              Set-Location -LiteralPath (Join-Path $root 'desktop')
              npm.cmd ci --fetch-timeout=20000 --fetch-retries=1
              if ($LASTEXITCODE -ne 0) { throw 'JavaScript dependency installation failed' }
            }
          )
          try {
            $jobs | Wait-Job | Out-Null
            foreach ($job in $jobs) {
              # Native tools may write progress or warnings to stderr even on exit 0.
              Receive-Job -Job $job -ErrorAction Continue
              if ($job.State -ne 'Completed') { throw "Dependency job failed: $($job.Id)" }
            }
          } finally {
            $jobs | Remove-Job -Force
          }
      - name: Product detail planning, caption and billing boundaries
        working-directory: desktop/sidecars/product-detail/app
        env:
          FLASK_ENV: development
          DEEPSEEK_API_KEY: sk-test-deepseek-fake
          REFINE_API_KEY: sk-test-refine-fake
          REFINE_API_BASE_URL: https://api.test-refine.local/v1
          ARK_API_KEY: ark-test-fake
        run: |
          $env:DATABASE_URL = "sqlite:///$($env:RUNNER_TEMP.Replace('\', '/'))/detail-tests.db"
          python -m pytest ai_refine_v2/tests -q
      - name: Install isolated E2E browser
        run: python -m playwright install chromium
      - name: Product detail local E2E
        working-directory: desktop
        run: |
          $env:XIAOXI_BUILD_PYTHON = (Get-Command python).Source
          $env:XIAOXI_PRODUCT_DETAIL_BROWSER_PATH = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve E2E Chromium' }
          node scripts/product-detail-local-e2e.cjs --cleanup-on-success
      - name: Official video gateway protocol
        working-directory: server/provider-gateway
        run: python -m unittest discover -s . -p 'test_bailian_video_routes.py'
      - name: Confirmed production, task summaries and provider accounting
        working-directory: desktop/sidecars/content-engine
        run: >-
          python -m unittest discover -s tests -p 'test_narrated*.py'
      - name: Production summaries
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_production_summary.py'
      - name: Local editor startup and render guards
        working-directory: desktop/sidecars/content-engine
        run: >-
          python -m unittest
          tests.test_creative_workbench.CreativeWorkbenchTests.test_metadata_ready_defers_render_probe_until_first_comparison_read
          tests.test_creative_workbench.CreativeWorkbenchTests.test_visual_comparison_preflight_is_local_exact_and_fail_closed
      - name: Video captions and presentation
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_video_presentation.py'
      - name: Provider accounting
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_provider_usage.py'
      - name: Reuse frozen avatar audio
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_digital_human_audio_upload.py'
      - name: Voice approvals and saved previews
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_auto_mix_voice_resources.py'
      - name: Bundled music and deep Windows installation paths
        working-directory: desktop/sidecars/content-engine
        run: python -m unittest discover -s tests -p 'test_builtin_music.py'

appId: com.aihuoke.desktop.test
productName: AI短视频获客 V1.0版本-测试版
compression: normal
directories:
  output: ../release/.installer-output
win:
  icon: public/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: AI获客 V1.0版本-测试版
  artifactName: AI短视频获客 V1.0版本-测试版-安装程序.${ext}
nsis:
  # Keep seed videos in the same archive covered by the full payload hash.
  preCompressedFileExtensions: []
  installerIcon: public/app-icon.ico
  uninstallerIcon: public/app-icon.ico
  include: build/installer-test.nsh
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # User 2026-11-11: the product is no longer a 测试版, so the names customers see drop it.
  # appId, install directory and executable keep their old names: updates and data depend on them.
  shortcutName: AI短视频获客
  uninstallDisplayName: AI短视频获客
  deleteAppDataOnUninstall: false
  differentialPackage: false
